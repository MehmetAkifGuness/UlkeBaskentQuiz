services:
  - type: web
    name: dunya-ulkeleri-backend
    runtime: docker
    rootDir: DunyaUlkeleri
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: dunya_ulkeleri_db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: dunya_ulkeleri_db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: dunya_ulkeleri_db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
