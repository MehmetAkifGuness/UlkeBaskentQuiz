spring.application.name=DunyaUlkeleri
server.port=${PORT:8080}
server.address=0.0.0.0

# ===============================
# 1. POSTGRESQL VERITABANI BAGLANTISI
# ===============================
#spring.datasource.url=jdbc:postgresql://localhost:5432/dunya_ulkeleri
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# ===============================
# 2. HIBERNATE / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 3. BASLANGIC VERISI (data.sql)
# ===============================
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# ===============================
# 4. MULTIPART (DOSYA YUKLEME)
# ===============================
# Dosya boyutu sunucu bellegine alinmadan once reddedilsin.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.resolve-lazily=true

# ===============================
# 4.1. APP AYARLARI (Profil Foto)
# ===============================
# Servis katmanindaki ek limit (dinamik olarak degistirilebilir).
app.user.avatar.max-size=2MB

# ===============================
# 4.2. APP AYARLARI (Lig / Kupa)
# ===============================
# Sezon her ayın 1'inde (YYYYMM) yenilenir. Kullanıcı ilk etkileşiminde kupa sıfırlanır.
app.league.win-trophies=30
app.league.loss-trophies=20
app.league.reset-trophies=0
app.league.min-trophies=0
app.league.monthly-decay-rate=0.20

# ===============================
# 5. JWT
# ===============================
jwt.secret=${JWT_SECRET}

# ===============================
# 6. E-POSTA (SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
