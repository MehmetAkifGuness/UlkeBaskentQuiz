spring.application.name=DunyaUlkeleri-test

# In-memory DB for tests (avoid local Postgres + env vars)
spring.datasource.url=jdbc:h2:mem:dunya_ulkeleri_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open_in_view=false

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Dummy secrets for context load
jwt.secret=test-secret
spring.mail.username=test
spring.mail.password=test
